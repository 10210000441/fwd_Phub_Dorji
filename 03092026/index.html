<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Practise Exercises</title>
		<style>
			body {
				background: #ced4da;
				margin: 0;

			}
