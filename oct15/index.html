<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Bootstrap demo</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>
	</head>
	<body style="margin: 20px">
		<form class="p-3">
			<div>
				<img src="image.png" />
				<h1 class="mb-2" style="font-weight: 900">Create You Account</h1>
				<p style="font-style: italic; color: gray">
					Your data is safe with us. We will never share your information.
				</p>
			</div>

			<div class="mb-3">
				<label for="email" class="form-label">Email Address</label>
				<input
					type="email"
					class="form-control is-invalid"
					id="em"
					required
					placeholder="dphub011@gmail.com"
				/>
				<div class="invalid-feedback">Please enter the Valid Email</div>
			</div>

			<div class="mb-2">
				<select class="form-select" aria-label="Default select example">
					<option selected>Qualification</option>
					<option value="1">10 Passed Out</option>
					<option value="2">12 Passed Out</option>
					<option value="3">Degree</option>
				</select>
			</div>
			<div class="mb-3">
				<label for="date" class="form-label">D.O.B</label>
				<input type="date" class="form-control" id="date" />
			</div>
			<label class="mb-1">Select the Gender</label>
			<div class="mb-3">
				<div class="form-check form-check-inline">
					<input
						class="form-check-input"
						type="radio"
						name="inlineRadioOptions"
						id="inlineRadio1"
						value="option1"
					/>
					<label class="form-check-label" for="inlineRadio1">Male</label>
				</div>
				<div class="form-check form-check-inline">
					<input
						class="form-check-input"
						type="radio"
						name="inlineRadioOptions"
						id="inlineRadio2"
						value="option2"
					/>
					<label class="form-check-label" for="inlineRadio2">Female</label>
				</div>
			</div>
			<div class="mb-3">
				<label for="inputPassword5" class="form-label">Password</label>
				<input
					type="password"
					id="inputPassword5"
					class="form-control"
					aria-describedby="passwordHelpBlock"
					placeholder="**********"
				/>
			</div>

			<div class="mb-3">
				<button
					type="button"
					class="btn btn-danger"
					data-bs-toggle="modal"
					data-bs-target="#staticBackdrop"
				>
					Delete
				</button>
				<div
					class="modal fade"
					id="staticBackdrop"
					data-bs-backdrop="static"
					data-bs-keyboard="false"
					tabindex="-1"
					aria-labelledby="staticBackdropLabel"
					aria-hidden="true"
				>
					<div class="modal-dialog">
						<div class="modal-content">
							<div class="modal-header">
								<h1 class="modal-title fs-5" id="staticBackdropLabel">
									Delete
								</h1>
								<button
									type="button"
									class="btn-close"
									data-bs-dismiss="modal"
									aria-label="Close"
								></button>
							</div>
							<div class="modal-body">
								Are you sure you want to delete this user!
							</div>
							<div class="modal-footer">
								<button
									type="button"
									class="btn btn-secondary"
									data-bs-dismiss="modal"
								>
									Cancel
								</button>
								<button type="button" class="btn btn-danger">Delete</button>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="col-12 mb-3">
				<div class="form-check">
					<input
						class="form-check-input"
						type="checkbox"
						id="inlineFormCheck"
					/>
					<label class="form-check-label" for="inlineFormCheck">
						Remember me
					</label>
				</div>
			</div>

			<button
				type="submit"
				class="btn"
				style="
					background-color: rgb(107, 77, 0);
					color: aliceblue;
					font-weight: 900;
				"
			>
				Sign In
			</button>
		</form>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
			crossorigin="anonymous"
		></script>
	</body>
</html>
